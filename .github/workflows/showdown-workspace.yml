name: Add Showdown workspace snapshot
on:
  push:
    paths:
      - 'tools/showdown_workspace_patch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/showdown_workspace_patch.py
      - run: python -m py_compile pages/13_SHOWDOWN_SIM.py nuke_showdown_workspace.py nuke_showdown_sim.py
      - name: Verify markers
        run: |
          grep -q 'Save / Load Workspace' pages/13_SHOWDOWN_SIM.py
          grep -q 'showdown_workspace_bytes' pages/13_SHOWDOWN_SIM.py
          grep -q 'st.rerun()' pages/13_SHOWDOWN_SIM.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/13_SHOWDOWN_SIM.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add true snapshot workspace to NFL Showdown"
          git push
