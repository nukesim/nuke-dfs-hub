name: Add FanDuel Portfolio Upload Export
on:
  push:
    paths:
      - 'tools/fanduel_main_portfolio_upload_patch.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/fanduel_main_portfolio_upload_patch.py
      - name: Verify
        run: |
          python -m py_compile pages/6_SIM.py
          grep -q 'build_fd_lineup_only_csv' pages/6_SIM.py
          grep -q 'Download FanDuel Upload CSV' pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m 'Add FanDuel ID-only portfolio upload export'
          git push
