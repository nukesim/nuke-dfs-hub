name: Hub SIM Bridge
on:
  push:
    branches: [main]
    paths:
      - 'tools/hub_sim_bridge_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Hub and SIM bridge
        run: |
          python tools/hub_sim_bridge_patch.py
          python -m py_compile app.py pages/6_SIM.py nuke_bridge.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Connect Hub player pool and SIM portfolio"
          git pull --rebase origin main
          git push
