name: Direct V6 Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V6 and cleanup
        run: |
          python tools/direct_v6_cleanup.py
          python -m py_compile nuke_portfolio.py pages/6_SIM.py
      - name: Test
        run: |
          python -m pip install -r requirements.txt
          pip install pytest
          pytest -q tests/test_nuke_sim_smoke.py tests/test_nuke_field.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nuke_portfolio.py pages/6_SIM.py .github/workflows/direct-v6-cleanup.yml
          git diff --cached --quiet || git commit -m "Deploy Portfolio Engine V6 and clean runtime UI"
          git push
