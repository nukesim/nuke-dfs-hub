name: Final SIM UI Cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean duplicate diagnostics
        run: |
          python tools/final_sim_ui_cleanup.py
          python -m py_compile pages/6_SIM.py nuke_portfolio.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py .github/workflows/final-sim-ui-cleanup.yml
          git diff --cached --quiet || git commit -m "Clean duplicate SIM performance diagnostics"
          git push
