name: NUKE SIM Smoke Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply player pool UX patch
        if: github.actor != 'github-actions[bot]'
        run: |
          python tools/patch_pool_ui.py
          python -m py_compile pages/6_SIM.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Add fast include exclude player pool workflow"
          git push
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run NUKE SIM tests
        run: pytest -q tests/test_nuke_sim_smoke.py tests/test_dk_contest_import.py tests/test_dk_export.py tests/test_historical_validation.py tests/test_nuke_calibration.py tests/test_crossseason_data.py tests/test_nuke_football_v21.py tests/test_contest_validation.py tests/test_public_contests.py tests/test_historical_dk.py tests/test_nuke_field.py
