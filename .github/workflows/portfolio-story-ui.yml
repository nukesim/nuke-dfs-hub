name: Portfolio Story UI
on:
  push:
    branches: [main]
    paths:
      - 'tools/portfolio_story_ui_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch portfolio analysis UI
        run: |
          python tools/portfolio_story_ui_patch.py
          python -m py_compile pages/6_SIM.py nuke_portfolio_story.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Add portfolio story and leverage dashboard"
          git pull --rebase origin main
          git push
