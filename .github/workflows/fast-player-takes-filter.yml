name: Fast Player Takes Filter
on:
  push:
    paths:
      - 'tools/fast_player_takes_filter_patch.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/fast_player_takes_filter_patch.py
      - name: Verify
        run: |
          python -m py_compile pages/6_SIM.py
          grep -q '@st.fragment' pages/6_SIM.py
          grep -q 'render_player_takes_fragment' pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m 'Make Player Takes position filtering fast'
          git push
