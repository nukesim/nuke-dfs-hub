name: Polish game pool UI

on:
  push:
    branches: [main]
    paths:
      - tools/polish_game_pool_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply game pool visual polish
        run: python tools/polish_game_pool_ui.py
      - name: Compile SIM page
        run: python -m py_compile pages/6_SIM.py
      - name: Verify polished UI markers
        run: |
          grep -q 'Team Action' pages/6_SIM.py
          grep -q 'TEAM TOTAL' pages/6_SIM.py
          grep -q 'SLATE RANK' pages/6_SIM.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git commit -m "Polish game-by-game player pool UI" || exit 0
          git pull --rebase origin main
          git push origin main
