name: Fix FanDuel IDs Only Now
on:
  push:
    paths:
      - 'tools/fix_fd_ids_only_now.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/fix_fd_ids_only_now.py
      - run: python -m py_compile pages/6_SIM.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Make FanDuel exports ID-only"
          git push
