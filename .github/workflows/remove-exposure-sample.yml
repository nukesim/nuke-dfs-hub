name: Remove exposure sample control

on:
  push:
    paths:
      - 'tools/remove_exposure_sample_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/remove_exposure_sample_patch.py
      - run: python -m py_compile pages/6_SIM.py nuke_workspace.py
      - name: Verify
        run: |
          ! grep -q 'Exposure sample' pages/6_SIM.py
          ! grep -q 'exposure_sample' pages/6_SIM.py
          grep -q 'exposure_table(players,results,len(results))' pages/6_SIM.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py nuke_workspace.py
          git commit -m 'Remove exposure sample and use full result set'
          git push
