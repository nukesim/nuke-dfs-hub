name: Add SIM workspace
on:
  push:
    paths:
      - 'tools/add_sim_workspace_patch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/add_sim_workspace_patch.py
      - run: python -m py_compile pages/6_SIM.py nuke_workspace.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add save and load workspace to NUKE SIM"
          git push
