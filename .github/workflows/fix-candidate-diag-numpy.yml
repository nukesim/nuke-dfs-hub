name: Fix Candidate Diagnostics Numpy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix and compile
        run: |
          python tools/fix_candidate_diag_numpy.py
          python -m py_compile pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Fix candidate diagnostics numpy import"
          git push
