name: Add Showdown max salary
on:
  push:
    paths:
      - tools/showdown_max_salary_patch.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/showdown_max_salary_patch.py
      - run: python -m py_compile pages/13_SHOWDOWN_SIM.py nuke_showdown_sim.py nuke_showdown_workspace.py
      - name: Verify markers
        run: |
          grep -q 'Maximum salary' pages/13_SHOWDOWN_SIM.py
          grep -q 'max_salary=max_salary' pages/13_SHOWDOWN_SIM.py
          grep -q 'showdown_max_salary' nuke_showdown_workspace.py
      - name: Commit
        run: |
          git config user.name "nukesim"
          git config user.email "bryson232323@gmail.com"
          git add pages/13_SHOWDOWN_SIM.py nuke_showdown_sim.py nuke_showdown_workspace.py
          git diff --cached --quiet || git commit -m "Add max salary control to Showdown SIM"
          git push
