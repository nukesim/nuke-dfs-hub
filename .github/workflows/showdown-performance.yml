name: Optimize Showdown performance
on:
  push:
    paths:
      - tools/showdown_performance_patch.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/showdown_performance_patch.py
      - run: python -m py_compile nuke_showdown_sim.py pages/13_SHOWDOWN_SIM.py
      - name: Verify optimized engine
        run: |
          grep -q 'batch_size = 256' nuke_showdown_sim.py
          grep -q 'team_codes' nuke_showdown_sim.py
          grep -q '_construction_label_fast' nuke_showdown_sim.py
      - name: Commit
        run: |
          git config user.name "nukesim"
          git config user.email "bryson232323@gmail.com"
          git add nuke_showdown_sim.py
          git diff --cached --quiet || git commit -m "Speed up Showdown candidate generation and scoring"
          git push
