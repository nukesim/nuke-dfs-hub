name: Fix FanDuel Hub State

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_fanduel_hub_state.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/fix_fanduel_hub_state.py
      - name: Compile app
        run: python -m py_compile app.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Fix FanDuel Hub slate and saved lineup state"
          git push
