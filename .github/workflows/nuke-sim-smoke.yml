name: NUKE SIM Smoke Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile NBA simulator source
        run: python -m py_compile pages/20_NBA_SIM.py nuke_nba_data.py nuke_nba_engine.py nuke_nba_late_swap.py
      - name: Run NBA slate and lineup tests
        run: pytest -q tests/test_nba_sim.py tests/test_nba_player_lab.py tests/test_nba_news_awareness.py tests/test_nba_late_swap.py
      - name: Run NUKE SIM tests
        run: pytest -q tests/test_nuke_sim_smoke.py tests/test_dk_contest_import.py tests/test_dk_export.py tests/test_historical_validation.py tests/test_nuke_calibration.py tests/test_crossseason_data.py tests/test_nuke_football_v21.py tests/test_contest_validation.py tests/test_public_contests.py tests/test_historical_dk.py tests/test_nuke_field.py tests/test_fanduel_slate.py
