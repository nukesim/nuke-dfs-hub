name: Add Injury Dashboard
on:
  push:
    paths:
      - 'tools/injury_dashboard_patch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/injury_dashboard_patch.py
      - run: python -m py_compile pages/6_SIM.py
      - name: Commit patch
        run: |
          git config user.name "nuke-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet && exit 0
          git commit -m "Add injury dashboard to NUKE Sim"
          git push
