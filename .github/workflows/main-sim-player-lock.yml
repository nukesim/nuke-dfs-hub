name: Main SIM Player Lock
on:
  push:
    paths:
      - 'tools/main_sim_player_lock_patch.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply player lock patch
        run: python tools/main_sim_player_lock_patch.py
      - name: Verify
        run: |
          python -m py_compile pages/6_SIM.py nuke_sim.py
          grep -q 'locked_indices=None' nuke_sim.py
          grep -q '"Lock":bool(cfg.get("lock",False))' pages/6_SIM.py
          grep -q 'locked_indices=locked_indices' pages/6_SIM.py
          grep -q '🔒 Locked' pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py nuke_sim.py
          git diff --cached --quiet || git commit -m 'Add player locks to main NUKE SIM'
          git push
