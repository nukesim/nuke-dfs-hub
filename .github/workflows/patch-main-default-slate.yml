name: Patch Main Default Slate

on:
  push:
    paths:
      - '.patch-main-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch app.py
        run: python tools/patch_main_default_slate.py
      - name: Validate syntax
        run: python -m py_compile app.py default_slate.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "nukesim"
          git config user.email "bryson232323@gmail.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes to commit"
            exit 0
          fi
          git commit -m "Auto-load weekly slate in main Hub"
          git push
