name: Add interactive Showdown construction mix
on:
  push:
    paths:
      - tools/showdown_live_construction_mix_patch.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/showdown_live_construction_mix_patch.py
      - run: python -m py_compile pages/13_SHOWDOWN_SIM.py nuke_showdown_sim.py
      - name: Verify
        run: |
          grep -q 'APPLY MIX & REBUILD PORTFOLIO' pages/13_SHOWDOWN_SIM.py
          grep -q 'showdown_construction_results_editor' pages/13_SHOWDOWN_SIM.py
          grep -q 'showdown_construction_editor_version' pages/13_SHOWDOWN_SIM.py
      - name: Commit
        run: |
          git config user.name "nukesim"
          git config user.email "bryson232323@gmail.com"
          git add pages/13_SHOWDOWN_SIM.py
          git diff --cached --quiet || git commit -m "Make Showdown construction mix interactive"
          git push
