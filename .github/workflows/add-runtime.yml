name: Tune SIM Runtime
on:
  push:
    paths:
      - '.runtime-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SIM
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/6_SIM.py'); s=p.read_text()
          old='st.header("SIM CONTROL ROOM"); preset=st.selectbox("Preset",["QUICK","STANDARD","DEEP"],index=1); presets={"QUICK":(300,500,50,300),"STANDARD":(700,1500,75,750),"DEEP":(1400,3000,100,1500)}; candidates,sims,exposure_n,contest_iters=presets[preset]'
          new='st.header("SIM CONTROL ROOM"); preset=st.selectbox("Preset",["QUICK","STANDARD","DEEP"],index=0); presets={"QUICK":(250,350,50,200),"STANDARD":(400,750,75,350),"DEEP":(700,1200,100,500)}; candidates,sims,exposure_n,contest_iters=presets[preset]'
          if old not in s: raise SystemExit('preset block not found')
          s=s.replace(old,new,1)
          s=s.replace('st.write("1/5 · Generating correlated DraftKings candidates..."); lineups=generate_lineups(players,int(candidates),int(min_salary),int(seed))','stage=time.perf_counter(); st.write("1/5 · Generating correlated DraftKings candidates..."); lineups=generate_lineups(players,int(candidates),int(min_salary),int(seed)); st.write(f"Candidate generation: {time.perf_counter()-stage:.1f}s")',1)
          s=s.replace('st.write(f"Generated {len(lineups):,} unique candidates."); st.write(f"2/5 · Simulating {int(sims):,} correlated football universes..."); matrix=simulate_player_matrix_v2(players,int(sims),int(seed))','st.write(f"Generated {len(lineups):,} unique candidates."); stage=time.perf_counter(); st.write(f"2/5 · Simulating {int(sims):,} correlated football universes..."); matrix=simulate_player_matrix_v2(players,int(sims),int(seed)); st.write(f"Football simulation: {time.perf_counter()-stage:.1f}s")',1)
          s=s.replace('st.write("3/5 · Ranking outcomes and assigning paths..."); results=attach_path_labels(players,evaluate_lineups(players,lineups,matrix)); exposure=exposure_table(players,results,int(exposure_n)); pexposure=path_exposure(results,int(exposure_n))','stage=time.perf_counter(); st.write("3/5 · Ranking outcomes and assigning paths..."); results=attach_path_labels(players,evaluate_lineups(players,lineups,matrix)); exposure=exposure_table(players,results,int(exposure_n)); pexposure=path_exposure(results,int(exposure_n)); st.write(f"Ranking + paths: {time.perf_counter()-stage:.1f}s")',1)
          s=s.replace('st.write(f"4/5 · Contest-simming all {len(results):,} candidates..."); contest_results,contest_summary=simulate_contest(results=results,player_matrix=matrix,field_size=int(field_size),entry_fee=float(entry_fee),first_prize=float(first_prize),iterations=int(contest_iters),seed=int(seed)+97,payouts_override=payouts_override)','stage=time.perf_counter(); st.write(f"4/5 · Contest-simming all {len(results):,} candidates..."); contest_results,contest_summary=simulate_contest(results=results,player_matrix=matrix,field_size=int(field_size),entry_fee=float(entry_fee),first_prize=float(first_prize),iterations=int(contest_iters),seed=int(seed)+97,payouts_override=payouts_override); st.write(f"Contest simulation: {time.perf_counter()-stage:.1f}s")',1)
          s=s.replace('st.write("5/5 · Building path-diversified portfolio..."); portfolio=build_portfolio(contest_results,size=int(portfolio_size),max_overlap=int(max_overlap),path_balance=float(path_balance)); portfolio_paths,portfolio_stats=portfolio_summary(portfolio)','stage=time.perf_counter(); st.write("5/5 · Building path-diversified portfolio..."); portfolio=build_portfolio(contest_results,size=int(portfolio_size),max_overlap=int(max_overlap),path_balance=float(path_balance)); portfolio_paths,portfolio_stats=portfolio_summary(portfolio); st.write(f"Portfolio build: {time.perf_counter()-stage:.1f}s")',1)
          p.write_text(s)
          PY
          python -m py_compile pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name nukesim
          git config user.email bryson232323@gmail.com
          git add pages/6_SIM.py
          git commit -m 'Reduce SIM defaults and show stage run times'
          git push
