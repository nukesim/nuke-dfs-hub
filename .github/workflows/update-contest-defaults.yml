name: Update NUKE SIM contest defaults

on:
  push:
    paths:
      - 'tools/update_contest_defaults.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/update_contest_defaults.py
      - run: python -m py_compile pages/6_SIM.py
      - name: Verify
        run: |
          grep -q '654761' pages/6_SIM.py
          grep -q '1000000.' pages/6_SIM.py
          grep -q '5.' pages/6_SIM.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py
          git commit -m 'Update NUKE SIM contest defaults'
          git push
