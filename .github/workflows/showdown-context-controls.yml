name: Add Showdown odds and controls
on:
  push:
    paths:
      - 'tools/showdown_context_controls_patch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/showdown_context_controls_patch.py
      - run: python -m py_compile pages/13_SHOWDOWN_SIM.py nuke_showdown_sim.py
      - name: Verify markers
        run: |
          grep -q "Sportsbook & Line Movement" pages/13_SHOWDOWN_SIM.py
          grep -q "Player Controls" pages/13_SHOWDOWN_SIM.py
          grep -q "player_mins" nuke_showdown_sim.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/13_SHOWDOWN_SIM.py nuke_showdown_sim.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Showdown odds movement and player exposure controls"
          git push
