name: FanDuel Lineup Rules

on:
  push:
    paths:
      - 'tools/fd_lineup_rules_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/fd_lineup_rules_patch.py
      - name: Compile
        run: python -m py_compile nuke_sim.py pages/6_SIM.py
      - name: Verify
        run: |
          grep -q 'No players vs opposing defense' pages/6_SIM.py
          grep -q 'no_offense_vs_dst=no_offense_vs_dst' pages/6_SIM.py
          grep -q 'team_counts.max()>4' nuke_sim.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nuke_sim.py pages/6_SIM.py
          git diff --cached --quiet || git commit -m 'Enforce FanDuel team limit and add defense conflict toggle'
          git push