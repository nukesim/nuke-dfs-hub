name: Rollback Platform Workspace
on:
  push:
    paths:
      - 'tools/rollback_platform_workspace.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/rollback_platform_workspace.py
      - run: python -m py_compile pages/6_SIM.py
      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Rollback platform workspace persistence"
          git push
