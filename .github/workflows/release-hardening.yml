name: Release Hardening
on:
  push:
    branches: [main]
    paths:
      - 'tools/release_hardening_patch.py'
      - 'nuke_run_audit.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch clean weekly reset and run audit
        run: |
          python tools/release_hardening_patch.py
          python -m py_compile app.py pages/6_SIM.py nuke_run_audit.py
      - name: Commit
        run: |
          git config user.name "nukesim"
          git config user.email "bryson232323@gmail.com"
          git add app.py pages/6_SIM.py nuke_run_audit.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add clean weekly reset and run audit trail"
          git push
