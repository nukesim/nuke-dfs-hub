name: Lazy SIM Results
on:
  push:
    paths:
      - '.lazy-results-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make results lazy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/6_SIM.py')
          s=p.read_text()
          marker='if results is not None and not results.empty:\n'
          head=s.split(marker,1)[0]
          tail=r'''if results is not None and not results.empty:
    render_started=time.perf_counter()
    sections=["🏆 CONTEST SIM","🧬 PORTFOLIO","☢️ NUKEM LINEUPS","🧭 PATHS","👤 EXPOSURE","🔗 COMBOS","📤 DK EXPORT","🧠 MODEL NOTES"]
    section=st.radio("Results view",sections,horizontal=True,label_visibility="collapsed",key="nuke_results_view")

    if section=="🏆 CONTEST SIM":
        if contest_results is not None and not contest_results.empty:
            m1,m2,m3,m4,m5,m6=st.columns(6); m1.metric("Field",f"{int(contest_summary.get('field_size',0)):,}"); m2.metric("Entry",f"${float(contest_summary.get('entry_fee',0)):,.2f}"); m3.metric("Paid Places",f"{int(contest_summary.get('paid_places',0)):,}"); m4.metric("Contest Sims",f"{int(contest_summary.get('iterations',0)):,}"); m5.metric("Lineups Simmed",f"{len(contest_results):,}"); m6.metric("Payout Model",str(contest_summary.get("payout_model","")))
            contest_dk=add_dk_roster_columns(sim_players,contest_results)
            left=["QB","RB1","RB2","WR1","WR2","WR3","TE","FLEX","DST","FLEX Pos","Stack"]
            stats=["Contest Rank","Sim ROI %","1st %","Top 0.1%","Top 1%","Cash %","Avg Finish","Expected Duplicates","Avg Payout","Strongest Path","Path Score","Lineup Thesis","NUKE Score","Ceiling 95","Salary"]
            contest_show=contest_dk[[c for c in left+stats if c in contest_dk.columns]].copy(); st.dataframe(contest_show,use_container_width=True,hide_index=True)
            st.download_button("Download Contest SIM + DK Lineups CSV",contest_show.to_csv(index=False).encode("utf-8-sig"),"nuke_contest_sim_dk_lineups.csv","text/csv")

    elif section=="🧬 PORTFOLIO":
        if portfolio is not None and not portfolio.empty:
            p1,p2,p3,p4=st.columns(4); p1.metric("Lineups",int(portfolio_stats.get("lineups",0))); p2.metric("Paths Covered",int(portfolio_stats.get("paths",0))); p3.metric("Avg Sim ROI",f"{float(portfolio_stats.get('avg_roi',0)):.1f}%"); p4.metric("Avg Duplicates",f"{float(portfolio_stats.get('avg_dup',0)):.2f}")
            st.dataframe(portfolio_paths,use_container_width=True,hide_index=True); st.dataframe(portfolio.drop(columns=["_indices"],errors="ignore"),use_container_width=True,hide_index=True)

    elif section=="☢️ NUKEM LINEUPS":
        show=results.drop(columns=["_indices"],errors="ignore"); st.dataframe(show.head(150),use_container_width=True,hide_index=True); st.download_button("Download NUKEM lineup results CSV",show.to_csv(index=False).encode("utf-8-sig"),"nuke_sim_results.csv","text/csv")

    elif section=="🧭 PATHS":
        st.subheader("Path Coverage"); st.dataframe(pexposure,use_container_width=True,hide_index=True); cols=[c for c in ["Rank","Strongest Path","Secondary Path","Path Score","Lineup Thesis","Stack","Salary","QB"] if c in results.columns]; st.dataframe(results[cols].head(int(exposure_n)),use_container_width=True,hide_index=True)

    elif section=="👤 EXPOSURE":
        st.subheader("Exposure Insights"); scope=st.radio("Exposure scope",["All contest-simmed lineups",f"Top {int(exposure_n)} NUKEM lineups"],horizontal=True)
        er=contest_results if scope.startswith("All") and contest_results is not None else results.head(int(exposure_n)); flex_table=flex_exposure_table(sim_players,er); pos_table=position_exposure_table(sim_players,er)
        fcols=st.columns(3); fmap={str(r["FLEX Position"]):r for _,r in flex_table.iterrows()}
        for col,pname in zip(fcols,["RB","WR","TE"]): col.metric(f"{pname} in FLEX",f"{int(fmap.get(pname,{}).get('Lineups',0)):,}",f"{float(fmap.get(pname,{}).get('Exposure %',0)):.1f}%")
        st.dataframe(flex_table,use_container_width=True,hide_index=True); pos_filter=st.selectbox("Position exposure",["ALL","QB","RB","WR","TE","DST"]); pshow=pos_table if pos_filter=="ALL" else pos_table[pos_table.Position.eq(pos_filter)]; st.dataframe(pshow,use_container_width=True,hide_index=True)
        st.markdown("**Top-player exposure detail**"); st.dataframe(exposure,use_container_width=True,hide_index=True)

    elif section=="🔗 COMBOS":
        st.subheader("Player Combo Exposure")
        combo_scope=portfolio if portfolio is not None and not portfolio.empty else contest_results
        if combo_scope is not None and not combo_scope.empty:
            combo_started=time.perf_counter(); pairs,qb_pairs=combo_exposure_table(sim_players,combo_scope)
            st.caption((f"Calculated across {len(combo_scope):,} portfolio lineups." if portfolio is not None and not portfolio.empty else f"Calculated across {len(combo_scope):,} contest-simmed lineups.")+f" · Combo analysis {time.perf_counter()-combo_started:.2f}s")
            if not pairs.empty:
                c1,c2,c3=st.columns(3); top=pairs.iloc[0]; c1.metric("Highest Combo",f"{top['Player 1']} + {top['Player 2']}"); c2.metric("Highest Combo %",f"{float(top['Portfolio Combo %']):.1f}%"); c3.metric("Combo Lineups",int(top['Combo Lineups']))
                st.markdown("#### Highest Overall Player Pairs"); relation=st.multiselect("Show relationships",["Same Team","Same Game","Non-Stacked"],default=["Same Team","Same Game","Non-Stacked"],key="combo_relation"); st.dataframe(pairs[pairs["Relationship"].isin(relation)].head(75),use_container_width=True,hide_index=True)
            if not qb_pairs.empty:
                st.markdown("#### QB-Anchored Combos"); st.caption("% of QB Lineups answers: when this QB is used, how often is the other player paired with him?"); qb_filter=st.selectbox("QB anchor",["All QBs"]+sorted(qb_pairs.QB.unique().tolist()),key="combo_qb"); qshow=qb_pairs if qb_filter=="All QBs" else qb_pairs[qb_pairs.QB.eq(qb_filter)]; st.dataframe(qshow.head(100),use_container_width=True,hide_index=True)
        else: st.info("Run the SIM to generate combo exposure.")

    elif section=="📤 DK EXPORT":
        st.subheader("📤 DraftKings Lineup Export"); source_options=["Portfolio","Contest-ranked","NUKEM-ranked"]; export_source=st.selectbox("Lineup source",source_options,index=1,key="dk_export_source"); export_results=portfolio if export_source=="Portfolio" and portfolio is not None and not portfolio.empty else contest_results if export_source=="Contest-ranked" and contest_results is not None and not contest_results.empty else results; max_export=min(150,len(export_results)); export_count=st.number_input("Lineups to export",1,max_export,min(20,max_export),1,key="dk_export_count")
        lineup_only=build_lineup_only_csv(sim_players,export_results,int(export_count)); st.download_button("Download DK lineup-only CSV",lineup_only,"nuke_dk_lineups.csv","text/csv")
        entries_upload=st.file_uploader("Upload your DraftKings Entries CSV",type=["csv"],key="dk_entries_upload")
        if entries_upload is not None:
            try:
                filled,info=fill_entries_csv(entries_upload.getvalue(),sim_players,export_results,int(export_count)); st.success(f"Filled {info['entries_filled']} DraftKings entries."); st.download_button("⬇️ Download DraftKings Upload CSV",filled,"nuke_draftkings_upload.csv","text/csv",type="primary")
            except Exception as e: st.error(f"Could not build DraftKings upload file: {e}")

    elif section=="🧠 MODEL NOTES":
        st.markdown("""**Weekly slate:** NUKE auto-loads the built-in current Sunday main slate. Upload a CSV only when you want to override it.\n\n**Football Engine V2:** game environment → team plays → pass/rush opportunity → player opportunity → football stats → DraftKings scoring.\n\n**Correlation:** tournament mixture of QB+1, QB+1/1, QB+2, QB+2/1 and QB+2/2 structures.\n\n**Exposure:** FLEX, player and pair-combo exposure can be inspected independently.\n\n**Contest model:** opponent popularity remains modeled, so simulated ROI is a model output rather than a guarantee.""")

    st.caption(f"View render time: {time.perf_counter()-render_started:.2f}s · SIM run time: {float(st.session_state.get('nuke_sim_runtime',0)):.1f}s")
'''
          p.write_text(head+tail)
          PY
          python -m py_compile pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name nukesim
          git config user.email bryson232323@gmail.com
          git add pages/6_SIM.py
          git commit -m 'Lazy render SIM result views for faster UI'
          git push
