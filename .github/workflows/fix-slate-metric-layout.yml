name: Fix slate metric layout

on:
  push:
    branches: [main]
    paths:
      - tools/fix_slate_metric_layout.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply slate layout fix
        run: python tools/fix_slate_metric_layout.py
      - name: Compile SIM page
        run: python -m py_compile pages/6_SIM.py
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          if git diff --cached --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git commit -m "Show full NUKE SIM slate label"
          git pull --rebase origin main
          git push origin main
