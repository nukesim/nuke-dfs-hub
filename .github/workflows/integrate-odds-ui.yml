name: Integrate Odds UI
on:
  push:
    paths:
      - '.odds-ui-trigger'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch SIM odds UI
        run: |
          python tools/integrate_odds_ui.py
          python -m py_compile pages/6_SIM.py nuke_game_pool.py nuke_odds.py tools/fetch_nfl_odds.py
      - name: Smoke test
        run: |
          python -m pip install -r requirements.txt
          pip install pytest
          pytest -q tests/test_nuke_sim_smoke.py tests/test_nuke_field.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Integrate automatic sportsbook odds and movement UI"
          git pull --rebase origin main
          git push origin main
