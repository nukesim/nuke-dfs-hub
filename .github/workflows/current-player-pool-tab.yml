name: Current Player Pool Tab
on:
  push:
    paths:
      - 'tools/current_player_pool_tab_patch.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/current_player_pool_tab_patch.py
      - name: Verify
        run: |
          python -m py_compile pages/6_SIM.py
          grep -q 'Current Player Pool' pages/6_SIM.py
          grep -q 'Active by Position' pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m 'Add current player pool dashboard to NUKE SIM'
          git push
