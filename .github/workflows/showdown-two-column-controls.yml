name: Showdown two-column controls
on:
  push:
    paths:
      - 'tools/showdown_two_column_controls.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/showdown_two_column_controls.py
      - run: python -m py_compile pages/13_SHOWDOWN_SIM.py
      - name: Verify markers
        run: |
          grep -q 'with st.expander("Line movement history", expanded=False)' pages/13_SHOWDOWN_SIM.py
          grep -q 'team_columns = st.columns(2)' pages/13_SHOWDOWN_SIM.py
          ! grep -q 'team_tabs = st.tabs' pages/13_SHOWDOWN_SIM.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/13_SHOWDOWN_SIM.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show Showdown teams side by side"
          git push
