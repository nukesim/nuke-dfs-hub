name: Fix SIM Indentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair portfolio export indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/6_SIM.py')
          s=p.read_text()
          targets=[
              'portfolio_export=add_dk_roster_columns',
              'preferred=["Portfolio Slot"',
              'portfolio_export=portfolio_export[[c for c in preferred',
              'st.dataframe(portfolio_export',
              'st.download_button("⬇️ Download Portfolio + Stats CSV"',
          ]
          lines=[]
          for line in s.splitlines():
              stripped=line.lstrip()
              if any(stripped.startswith(t) for t in targets):
                  line='            '+stripped
              lines.append(line)
          p.write_text('\n'.join(lines)+'\n')
          PY
          python -m py_compile pages/6_SIM.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Fix portfolio export indentation"
          git push
