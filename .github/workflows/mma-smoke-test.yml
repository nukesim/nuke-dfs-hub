name: MMA Sim smoke test

on:
  push:
    branches: [main]
    paths:
      - "pages/17_MMA_SIM.py"
      - "nuke_nav.py"
      - "data/mma_current.csv"
      - "data/mma_fighter_stats.csv"
      - "tools/check_mma_live.py"
      - "tools/test_mma_stats.py"
      - ".github/workflows/mma-smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile MMA page
        run: python -m py_compile pages/17_MMA_SIM.py nuke_nav.py
      - name: Install MMA test dependencies
        run: python -m pip install streamlit pandas numpy requests
      - name: Test fighter parsers and outage fallback
        run: python tools/test_mma_stats.py
      - name: Validate bundled MMA slate
        run: |
          python - <<'PY'
          import csv
          p="data/mma_current.csv"
          with open(p,newline="",encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          req={"Name","ID","Salary","Game Info","AvgPointsPerGame"}
          assert rows and req.issubset(rows[0]), rows[0].keys() if rows else "empty"
          assert len(rows)>=12, len(rows)
          fights={r["Game Info"] for r in rows}
          assert len(fights)>=6, len(fights)
          print(f"{len(rows)} fighters / {len(fights)} fights")
          PY
