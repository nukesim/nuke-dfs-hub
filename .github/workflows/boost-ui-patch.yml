name: Boost UI Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Take selector UI
        run: |
          python tools/boost_ui_patch.py
          python -m py_compile pages/6_SIM.py
      - name: Install and smoke test
        run: |
          python -m pip install -r requirements.txt
          pip install pytest
          pytest -q tests/test_nuke_sim_smoke.py tests/test_nuke_field.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Replace typed Boost with click-select Take levels"
          git push
