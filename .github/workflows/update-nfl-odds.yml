name: Update NFL Odds
on:
  schedule:
    - cron: '0 0,6,12,18 * * 1-6'
    - cron: '0 10-23 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pandas requests
      - name: Fetch current NFL odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python tools/fetch_nfl_odds.py
      - name: Commit odds snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_odds_current.csv data/nfl_odds_history.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update NFL odds snapshot"
          git pull --rebase origin main
          git push origin main
