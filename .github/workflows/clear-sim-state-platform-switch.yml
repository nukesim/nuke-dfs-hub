name: Clear SIM State On Platform Switch
on:
  push:
    paths:
      - 'tools/clear_sim_state_on_platform_switch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/clear_sim_state_on_platform_switch.py
      - run: python -m py_compile pages/6_SIM.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Clear SIM results when switching DFS platform"
          git push
