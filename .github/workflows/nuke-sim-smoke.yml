name: NUKE SIM Smoke Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pregame roster layout patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/6_SIM.py')
          s=p.read_text()
          old='''        rows=[]
        for idx,row in gp.iterrows():
            key=str(row.ID) if str(row.ID) else f"{row.Name}|{row.Team}|{row.Position}|{int(row.Salary)}"
            saved=pool_state.get(key,{})
            rows.append({"_row":int(idx),"_key":key,"Include":bool(saved.get("include",True)),"Player":row.Name,"Pos":row.Position,"Team":row.Team,"Salary":int(row.Salary),"Auto Role":row.auto_role,"Boost":float(saved.get("boost",0.0)),"Role":str(saved.get("role","AUTO")),"Usage x":float(saved.get("usage",1.0))})
        edit_df=pd.DataFrame(rows).set_index("_row")
        edited_game=st.data_editor(edit_df.drop(columns=["_key"]),use_container_width=True,hide_index=True,disabled=["Player","Pos","Team","Salary","Auto Role"],column_config={"Include":st.column_config.CheckboxColumn("Include"),"Boost":st.column_config.NumberColumn("Boost",min_value=-3.0,max_value=3.0,step=1.0,format="%.0f",help="Personal preference only. Changes how often this player appears in candidate generation, not simulated fantasy points."),"Role":st.column_config.SelectboxColumn("Role",options=["AUTO","QB1","RB1","RB2","RB3","WR1","WR2","WR3","TE1","BACKUP"]),"Usage x":st.column_config.NumberColumn("Usage x",min_value=.25,max_value=2.25,step=.05,format="%.2f",help="Changes the football simulation itself. Leave at 1.00 unless you believe the player's actual role/usage changes.")},key=f"game_pool_{str(game)}")
        for idx,erow in edited_game.iterrows():
            key=str(edit_df.loc[idx,"_key"])
            updated_state[key]={"include":bool(erow["Include"]),"boost":float(erow["Boost"]),"role":str(erow["Role"]),"usage":float(erow["Usage x"])}
'''
          new='''        team_cols=st.columns(max(1,len(teams[:2])))
        for team_col,team in zip(team_cols,teams[:2]):
            tp=gp[gp.Team.eq(team)].copy().sort_values(["Position","Salary"],ascending=[True,False])
            trow=ge[ge.Team.eq(team)].iloc[0] if not ge.empty and ge.Team.eq(team).any() else None
            with team_col:
                if trow is not None:
                    st.markdown(f"### {team}  ·  TT {float(trow['Team Total']):.1f}  ·  #{int(trow['Team Total Rank'])}")
                else:
                    st.markdown(f"### {team}")
                rows=[]
                for idx,row in tp.iterrows():
                    key=str(row.ID) if str(row.ID) else f"{row.Name}|{row.Team}|{row.Position}|{int(row.Salary)}"
                    saved=pool_state.get(key,{})
                    rows.append({"_row":int(idx),"_key":key,"Include":bool(saved.get("include",True)),"Pos":row.Position,"Player":row.Name,"Salary":int(row.Salary),"Auto Role":row.auto_role,"Boost":float(saved.get("boost",0.0)),"Role":str(saved.get("role","AUTO")),"Usage x":float(saved.get("usage",1.0))})
                edit_df=pd.DataFrame(rows).set_index("_row")
                edited_team=st.data_editor(
                    edit_df.drop(columns=["_key"]),
                    use_container_width=True,
                    hide_index=True,
                    disabled=["Pos","Player","Salary","Auto Role"],
                    column_order=["Include","Pos","Player","Salary","Auto Role","Boost","Role","Usage x"],
                    column_config={
                        "Include":st.column_config.CheckboxColumn("Include",width="small"),
                        "Pos":st.column_config.TextColumn("Pos",width="small"),
                        "Player":st.column_config.TextColumn("Player",width="medium"),
                        "Salary":st.column_config.NumberColumn("Salary",format="$%d",width="small"),
                        "Auto Role":st.column_config.TextColumn("Auto Role",width="small"),
                        "Boost":st.column_config.NumberColumn("Boost",min_value=-3.0,max_value=3.0,step=1.0,format="%.0f",width="small",help="Personal preference only. Changes candidate generation, not simulated fantasy points."),
                        "Role":st.column_config.SelectboxColumn("Role",options=["AUTO","QB1","RB1","RB2","RB3","WR1","WR2","WR3","TE1","BACKUP"],width="small"),
                        "Usage x":st.column_config.NumberColumn("Usage x",min_value=.25,max_value=2.25,step=.05,format="%.2f",width="small",help="Changes the football simulation itself. Leave at 1.00 unless you believe actual usage changes."),
                    },
                    key=f"game_pool_{str(game)}_{team}",
                )
                for idx,erow in edited_team.iterrows():
                    key=str(edit_df.loc[idx,"_key"])
                    updated_state[key]={"include":bool(erow["Include"]),"boost":float(erow["Boost"]),"role":str(erow["Role"]),"usage":float(erow["Usage x"])}
'''
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile pages/6_SIM.py nuke_game_pool.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || (git commit -m "Improve game-by-game roster layout" && git push)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run NUKE SIM tests
        run: pytest -q tests/test_nuke_sim_smoke.py tests/test_dk_contest_import.py tests/test_dk_export.py tests/test_historical_validation.py tests/test_nuke_calibration.py tests/test_crossseason_data.py tests/test_nuke_football_v21.py tests/test_contest_validation.py tests/test_public_contests.py tests/test_historical_dk.py tests/test_nuke_field.py
