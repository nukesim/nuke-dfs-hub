name: Public launch cleanup

on:
  push:
    paths:
      - 'tools/public_launch_cleanup_patch.py'
      - '.github/workflows/public-launch-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply public launch cleanup
        run: python tools/public_launch_cleanup_patch.py
      - name: Compile changed Python files
        run: python -m py_compile app.py pages/6_SIM.py pages/11_GUIDE.py nuke_nav.py
      - name: Commit generated changes
        run: |
          git config user.name "nukesim"
          git config user.email "bryson232323@gmail.com"
          git add app.py pages/6_SIM.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Polish NUKE for public launch"
            git push origin main
          fi
