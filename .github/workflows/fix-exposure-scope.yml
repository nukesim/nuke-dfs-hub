name: Fix exposure scope

on:
  push:
    paths:
      - 'tools/fix_exposure_scope.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/fix_exposure_scope.py
      - run: python -m py_compile pages/6_SIM.py
      - name: Verify
        run: |
          ! grep -q 'exposure_n' pages/6_SIM.py
          grep -q 'All generated NUKE lineups' pages/6_SIM.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py
          git commit -m 'Fix exposure scope after removing sample control'
          git push
