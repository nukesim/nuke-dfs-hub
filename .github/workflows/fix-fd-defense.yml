name: Fix FanDuel Defense Export
on:
  push:
    paths:
      - 'tools/fix_fd_defense_patch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/fix_fd_defense_patch.py
      - run: python -m py_compile nuke_sim.py fd_export.py pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nuke_sim.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix FanDuel defense names in SIM exports"
          git push
