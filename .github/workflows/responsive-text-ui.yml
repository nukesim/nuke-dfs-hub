name: Responsive text UI

on:
  push:
    branches: [main]
    paths:
      - tools/apply_responsive_text.py
      - nuke_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive text fixes
        run: python tools/apply_responsive_text.py
      - name: Compile public pages
        run: python -m py_compile app.py pages/6_SIM.py pages/11_GUIDE.py nuke_ui.py
      - name: Commit generated page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/6_SIM.py pages/11_GUIDE.py
          if git diff --cached --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git commit -m "Apply responsive text fixes across public NUKE pages"
          git pull --rebase origin main
          git push origin main
