name: Remove TT Label
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove TT from team headers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/6_SIM.py')
          s=p.read_text()
          old='st.markdown(f"### {team} · TT {float(trow[\'Team Total\']):.1f} · Rank #{int(trow[\'Team Total Rank\'])}")'
          new='st.markdown(f"### {team} · {float(trow[\'Team Total\']):.1f} · Rank #{int(trow[\'Team Total Rank\'])}")'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m "Remove TT label from team headers"
          git push
