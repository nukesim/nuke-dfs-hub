name: FanDuel Review Defense Order
on:
  push:
    paths:
      - 'tools/fd_review_defense_order_patch.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/fd_review_defense_order_patch.py
      - name: Verify
        run: |
          python -m py_compile pages/6_SIM.py
          grep -q 'defense_col="D" if site=="FD" else "DST"' pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m 'Place defense next to FLEX in portfolio export'
          git push