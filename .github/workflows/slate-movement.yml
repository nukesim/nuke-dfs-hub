name: Slate movement patch

on:
  push:
    paths:
      - 'tools/slate_movement_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch slate movement UI
        run: python tools/slate_movement_patch.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Show opening line movement in slate overview"
          git push
