name: Main Lineup Rules Card
on:
  push:
    paths:
      - 'tools/main_lineup_rules_card_patch.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/main_lineup_rules_card_patch.py
      - name: Verify
        run: |
          python -m py_compile pages/6_SIM.py
          grep -q '🛡️ Lineup Rules' pages/6_SIM.py
          grep -q 'No players vs opposing defense' pages/6_SIM.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/6_SIM.py
          git diff --cached --quiet || git commit -m 'Move defense conflict rule to visible main card'
          git push
