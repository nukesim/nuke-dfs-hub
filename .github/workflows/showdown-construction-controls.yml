name: Add Showdown construction controls
on:
  push:
    paths:
      - 'tools/showdown_construction_controls_patch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/showdown_construction_controls_patch.py
      - run: python -m py_compile pages/13_SHOWDOWN_SIM.py nuke_showdown_sim.py nuke_showdown_workspace.py
      - name: Verify markers
        run: |
          ! grep -q 'Game-Script Leaders' pages/13_SHOWDOWN_SIM.py
          grep -q 'Construction Limits' pages/13_SHOWDOWN_SIM.py
          grep -q 'showdown_construction_controls' pages/13_SHOWDOWN_SIM.py
          grep -q 'construction_mins' nuke_showdown_sim.py
          grep -q 'Construction %' pages/13_SHOWDOWN_SIM.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/13_SHOWDOWN_SIM.py nuke_showdown_sim.py nuke_showdown_workspace.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add team-aware Showdown construction controls"
          git push
